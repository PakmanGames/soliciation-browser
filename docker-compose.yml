# A fixed project name keeps one shared database across all git worktrees.
name: solicitation-browser

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solicitations
    # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solicitations"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
